<style>

button,input,select,textarea{font:inherit;color:inherit}

.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;z-index:60;display:flex;gap:12px;align-items:center;max-width:92%}

.two{display:grid;gap:10px;grid-template-columns:1fr 1fr}

details summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
</style>

<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" id="nav" aria-label="Main"></nav>
<div id="overlay"></div>
<div id="toast"></div>
<script>
/* Attendance engine — pure functions, no DOM. Works in browser (window.AttEngine) and Node. */
(function (root) {
'use strict';
const E = {};
const EPS = 1e-9;
const pad = n => String(n).padStart(2, '0');
E.SCHEMA = 2;

/* ---------- dates & time (all calendar dates are plain 'YYYY-MM-DD' strings; no local-timezone Date use) ---------- */
E.isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && E.fmt(E.parseDate(s)) === s;
E.isTime = s => typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
E.parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
E.fmt = d => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
E.addDays = (s, n) => { const d = E.parseDate(s); d.setUTCDate(d.getUTCDate() + n); return E.fmt(d); };
E.dow = s => E.parseDate(s).getUTCDay();                 // 0 = Sunday
E.mondayOf = s => { const w = E.dow(s); return E.addDays(s, w === 0 ? -6 : 1 - w); };
E.toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
E.hours = (a, b) => (E.toMin(b) - E.toMin(a)) / 60;
E.nowIST = (d = new Date()) => {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(d);
  const g = t => p.find(x => x.type === t).value;
  return { date: `${g('year')}-${g('month')}-${g('day')}`, min: (+g('hour')) * 60 + (+g('minute')) };
};

/* ---------- core arithmetic ---------- */
const clean = x => (Math.abs(x) < EPS ? 0 : x);
E.pct = (A, C) => (C > EPS ? (A / C) * 100 : null);
E.meets = (A, C, T) => C > EPS && (A / C) * 100 >= T - 1e-7;
// Additional hours that must be attended (all future hours attended) to reach T.
E.required = (A, C, T) => {
  if (C <= EPS || E.meets(A, C, T)) return 0;
  const t = T / 100;
  if (t >= 1) return Infinity;
  return clean(Math.max(0, (t * C - A) / (1 - t)));
};
// Governing inequality: A + (F - M) >= t (C + F)  =>  M <= A + F - t (C + F); clamp to [0, F].
E.maxAbsence = (A, C, F, T) => {
  const t = T / 100;
  return clean(Math.max(0, Math.min(F, A + F - t * (C + F))));
};
// Walk future sessions in order assuming attendance (optionally fractional); first session that reaches T.
E.project = (A, C, T, list) => {
  if (C > EPS && E.meets(A, C, T)) return { status: 'reached' };
  if (!list.length) return { status: 'none' };
  let a = A, c = C, n = 0;
  for (const s of list) {
    n++; a += s.dur * (s.frac == null ? 1 : s.frac); c += s.dur;
    if (E.meets(a, c, T)) return { status: 'ok', session: s, count: n, pct: (a / c) * 100 };
  }
  return { status: 'unreachable', finalPct: c > EPS ? (a / c) * 100 : null };
};
// How many whole future sessions could be skipped within M hours (shortest-first, and next-in-order).
E.skippable = (M, list) => {
  const d = list.map(s => s.dur).sort((a, b) => a - b); let tot = 0, shortest = 0;
  for (const x of d) { if (tot + x <= M + EPS) { tot += x; shortest++; } else break; }
  tot = 0; let inOrder = 0;
  for (const s of list) { if (tot + s.dur <= M + EPS) { tot += s.dur; inOrder++; } else break; }
  return { shortest, inOrder };
};
E.classify = ({ C, A, F, M, T }) => {
  if (C <= EPS) return 'nodata';
  if (E.meets(A, C, T)) return 'ontrack';
  if (F <= EPS) return 'unavailable';
  return M < 2 - EPS ? 'atrisk' : 'below';
};

/* ---------- default data ---------- */
E.STATUSES = ['none', 'present', 'absent', 'partial', 'excused', 'cancelled'];
const SLOT = (day, start, end, subject, type, clinical) => ({ id: day + '-' + start.replace(':', ''), day, start, end, subject, type, clinical: !!clinical });
E.defaultTemplate = () => {
  const L = 'Theory lecture', CP = 'Clinical posting', SP = 'Sports';
  const d = (day, a, b, c, d2, e) => [
    SLOT(day, '08:15', '09:15', a, L), SLOT(day, '09:15', '12:15', 'Clinical Posting', CP, true),
    ...b, SLOT(day, '16:00', '17:00', 'Sports', SP)];
  const mk = (day, s) => SLOT(day, s[0], s[1], s[2], L);
  const out = [];
  const days = {
    1: ['Medicine & Allied', [['13:00', '14:00', 'FMT'], ['14:00', '15:00', 'Community Medicine'], ['15:00', '16:00', 'Community Medicine']]],
    2: ['Medicine & Allied', [['13:00', '14:00', 'Paediatrics'], ['14:00', '15:00', 'ENT'], ['15:00', '16:00', 'ENT']]],
    3: ['Surgery & Allied', [['13:00', '14:00', 'FMT'], ['14:00', '15:00', 'Ophthalmology'], ['15:00', '16:00', 'Ophthalmology']]],
    4: ['Paediatrics', [['13:00', '14:00', 'Ophthalmology'], ['14:00', '15:00', 'Obstetrics & Gynaecology'], ['15:00', '16:00', 'FMT']]],
    5: ['ENT', [['13:00', '14:00', 'Community Medicine'], ['14:00', '15:00', 'Community Medicine'], ['15:00', '16:00', 'Community Medicine']]],
    6: ['Surgery & Allied', [['12:15', '13:15', 'Obstetrics & Gynaecology'], ['14:00', '15:00', 'FMT'], ['15:00', '16:00', 'Community Medicine']]],
  };
  for (const day of Object.keys(days)) {
    const [first, rest] = days[day]; const dn = +day;
    out.push(SLOT(dn, '08:15', '09:15', first, L), SLOT(dn, '09:15', '12:15', 'Clinical Posting', CP, true));
    rest.forEach(r => { const slot = mk(dn, r); if (dn === 6 && (slot.subject === 'FMT' || slot.subject === 'Obstetrics & Gynaecology')) slot.type = 'Practical'; out.push(slot); });
    out.push(SLOT(dn, '16:00', '17:00', 'Sports', SP));
  }
  return out;
};
E.defaultEvents = () => [
  { id: 'ev-term-start', name: 'Academic term starts', kind: 'term', from: '2026-10-12', to: '2026-10-12', effect: 'normal', subjects: [], types: [], note: '', unconfirmed: false },
  { id: 'ev-winter', name: 'Winter vacation', kind: 'vacation', from: '2026-11-07', to: '2026-11-13', effect: 'all', subjects: [], types: [], note: '', unconfirmed: false },
  { id: 'ev-pct1', name: 'PCT-I examinations — ENT, Ophthalmology', kind: 'exam', from: '2026-12-15', to: '2026-12-16', effect: 'normal', subjects: [], types: [], note: 'Effect on regular classes not stated in the timetable — set it when known.', unconfirmed: true },
  { id: 'ev-t1a', name: 'I Term End Theory — Medicine, Surgery, OB/GY, Paediatrics', kind: 'exam', from: '2027-02-15', to: '2027-02-21', effect: 'normal', subjects: [], types: [], note: 'Effect on regular classes not stated — set it when known.', unconfirmed: true },
  { id: 'ev-t1b', name: 'I Term End Theory — Community Medicine, FMT, ENT, Ophthalmology', kind: 'exam', from: '2027-02-22', to: '2027-02-28', effect: 'normal', subjects: [], types: [], note: 'Effect on regular classes not stated — set it when known.', unconfirmed: true },
  { id: 'ev-fmtprac', name: 'FMT practical examinations', kind: 'exam', from: '2027-03-01', to: '2027-03-07', effect: 'normal', subjects: [], types: [], note: 'Effect on regular classes not stated — set it when known.', unconfirmed: true },
  { id: 'ev-fmtautopsy', name: 'FMT autopsy posting period (batches of 15, 2 days each)', kind: 'posting', from: '2027-05-24', to: '2027-06-08', effect: 'normal', subjects: [], types: [], note: 'Overlaps summer vacation (24–30 May). Individual 2-day slots are not listed; add them as extra sessions.', unconfirmed: true },
  { id: 'ev-summer', name: 'Summer vacation', kind: 'vacation', from: '2027-05-24', to: '2027-05-30', effect: 'all', subjects: [], types: [], note: '', unconfirmed: false },
  { id: 'ev-prelims', name: 'Prelims — Theory & Practicals: Community Medicine, FMT, ENT, Ophthalmology', kind: 'exam', from: '2027-06-14', to: '2027-07-04', effect: 'normal', subjects: [], types: [], note: 'Effect on regular classes not stated — set it when known.', unconfirmed: true },
  { id: 'ev-termend', name: 'Listed term end date', kind: 'term', from: '2027-09-30', to: '2027-09-30', effect: 'normal', subjects: [], types: [], note: 'Timetable says Saturday; 30 Sep 2027 is a Thursday — verify.', unconfirmed: false, statedWeekday: 'Saturday' },
];
E.defaultState = () => ({
  schema: E.SCHEMA,
  settings: {
    target: 80, startDate: '2026-10-12', teachingEnds: '2027-06-13', termEnd: '2027-09-30', grouping: 'subjectType',
    excludedTypes: ['Sports'], approved: 'excluded', denominator: 'scheduled', policyConfirmed: false,
    batch: 'D', group: 'Batch 76–100 (100 & 104)', groupConfirmed: false,
  },
  types: ['Theory lecture', 'Practical', 'Clinical posting', 'Small Group Discussion (SGD)', 'Integrated teaching', 'AETCOM', 'Seminar', 'Sports', 'Other'],
  template: E.defaultTemplate(),
  rotation: [
    { id: 'rot1', from: '2026-10-12', to: '2026-10-18', dept: 'ENT' },
    { id: 'rot2', from: '2026-10-19', to: '2026-10-25', dept: 'ENT' },
    { id: 'rot3', from: '2026-10-26', to: '2026-11-08', dept: 'Paediatrics' },
  ],
  events: E.defaultEvents(),
  entries: {}, extras: [], opening: {},
  meta: { lastExport: null },
});

/* ---------- sessions ---------- */
E.rotationDept = (date, rot) => { const r = rot.find(x => x.from <= date && date <= x.to); return r ? r.dept : null; };
E.eventsOn = (date, events) => events.filter(e => e.from <= date && date <= e.to);
E.eventCancels = (ev, s) => ev.effect === 'all' || (ev.effect === 'subjects' && (ev.subjects || []).includes(s.subject)) || (ev.effect === 'types' && (ev.types || []).includes(s.type));
E.UNASSIGNED = 'Clinical posting (dept unassigned)';
E.generateSessions = (state, from, to) => {
  const st = state.settings, out = [];
  let d = from < st.startDate ? st.startDate : from; const cutoff = st.teachingEnds || '2027-06-13'; const end = to > cutoff ? cutoff : to;
  while (d <= end) {
    const w = E.dow(d), evs = E.eventsOn(d, state.events);
    if (w >= 1 && w <= 6) {
      for (const slot of state.template) {
        if (slot.day !== w) continue;
        const id = d + '_' + slot.id, en = state.entries[id];
        if (en && en.deleted) continue;
        let base = { start: slot.start, end: slot.end, subject: slot.subject, type: slot.type };
        if (slot.clinical) base.subject = E.rotationDept(d, state.rotation) || E.UNASSIGNED;
        if (en && en.snap) base = Object.assign({}, base, en.snap);
        out.push(E._finish(Object.assign({ id, date: d, slotId: slot.id, extra: false }, base), en, evs));
      }
    }
    d = E.addDays(d, 1);
  }
  for (const x of state.extras) {
    if (x.date < from || x.date > to) continue;
    const en = state.entries[x.id]; if (en && en.deleted) continue;
    const base = Object.assign({ id: x.id, date: x.date, extra: true }, { start: x.start, end: x.end, subject: x.subject, type: x.type }, en && en.snap || {});
    out.push(E._finish(base, en, E.eventsOn(x.date, state.events)));
  }
  out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : E.toMin(a.start) - E.toMin(b.start) || (a.id < b.id ? -1 : 1));
  return out;
};
E._finish = (s, en, evs) => {
  s.dur = E.hours(s.start, s.end);
  s.status = (en && en.status) || 'none'; s.attMin = en && en.attMin != null ? en.attMin : null; s.note = (en && en.note) || '';
  s.edited = !!(en && en.edited);
  const cancelling = evs.find(ev => E.eventCancels(ev, s));
  s.auto = false;
  if (cancelling) {
    s.eventName = cancelling.name;
    if (s.status === 'none') { s.status = 'cancelled'; s.auto = true; }
    else if (s.status !== 'cancelled') s.heldDespite = true;
  }
  return s;
};
E.contrib = (s, approved) => {
  const D = s.dur;
  switch (s.status) {
    case 'present': return { cond: D, att: D, excl: 0 };
    case 'absent': return { cond: D, att: 0, excl: 0 };
    case 'partial': return { cond: D, att: Math.min(Math.max(s.attMin || 0, 0) / 60, D), excl: 0 };
    case 'excused':
      if (approved === 'attended') return { cond: D, att: D, excl: 0 };
      if (approved === 'absent') return { cond: D, att: 0, excl: 0 };
      return { cond: D, att: 0, excl: D };
    default: return null;
  }
};
E.isFuture = (s, now) => s.status === 'none' && (s.date > now.date || (s.date === now.date && E.toMin(s.end) > now.min));
E.trackKey = (s, st) => st.grouping === 'subject' ? s.subject : s.subject + ' — ' + s.type;

/* ---------- tracks ---------- */
E.finalizeTrack = (t, T, mode) => {
  mode = mode || 'conducted'; t.mode = mode;
  t.C = Math.max(0, t.conducted - t.excluded);
  t.A = Math.min(t.A, t.C);
  t.missed = Math.max(0, t.C - t.A);
  t.F = t.future.reduce((a, s) => a + s.dur, 0);
  t.unrecH = (t.unrecordedPast || []).reduce((a, s) => a + s.dur, 0);
  t.R = t.F + t.unrecH;
  t.curPct = E.pct(t.A, t.C);
  t.target = T;
  if (mode === 'scheduled') {

   <div class="card stat"><b>${list.length}</b>tracked</div><div class="card stat"><b>${cnt('ontrack') + cnt('onpace')}</b>meeting / on pace</div>
   <div class="card stat"><b>${cnt('atrisk') + cnt('below') + cnt('unavailable')}</b>below target</div><div class="card stat"><b>${cnt('nodata')}</b>insufficient data</div></div>
  <p class="sub">Informational overall: ${ov.pct == null ? 'no data yet' : fp(ov.pct) + ' (' + fh(ov.A) + ' of ' + fh(ov.C) + ')'} — total attended ÷ total ${S.settings.denominator === 'conducted' ? 'conducted' : 'term'} hours. This is not proof of eligibility; each subject/session type is assessed separately.</p>
  <h2>Next class</h2><div class="card">${nextS ? `<b>${esc(nextS.subject)}</b> · ${esc(nextS.type)}<div class="sub">${fd(nextS.date, true)} · ${ft(nextS.start)}–${ft(nextS.end)}</div>` : '<span class="mut">No upcoming scheduled class found in the next two weeks.</span>'}</div>
  <div class="row sp"><h2>Today</h2><button class="sm" data-a="nav" data-v="today">Open Today</button></div>
  <div class="card">${todays.length ? todays.map(s => `<div class="row sp" style="padding:4px 0"><span>${ft(s.start)} ${esc(s.subject)} <span class="sub">${esc(s.type)}</span></span>${badge(s.status, STL[s.status] + (s.auto ? ' (' + s.eventName + ')' : ''))}</span></div>`).join('') : '<span class="mut">No classes scheduled today.</span>'}</div>
  <h2>Needs attention</h2>${risk.length ? `<div class="grid">${risk.map(trackCard).join('')}</div>` : '<div class="card mut">Nothing below target. Subjects with no data yet are not flagged.</div>'}
  <h2>Upcoming holidays &amp; exams</h2><div class="card">${ev.map(e => `<div class="row sp" style="padding:4px 0"><span><b>${esc(e.name)}</b><div class="sub">${fd(e.from)}${e.to !== e.from ? ' – ' + fd(e.to) : ''} · ${effLabel(e)}</div></span></div>`).join('') || '<span class="mut">None listed.</span>'}<p class="sub">No public holidays are preloaded. Add them under Timetable → Calendar so projections stay accurate.</p></div>`;
}
function effLabel(e) { return { normal: 'normal teaching continues' + (e.unconfirmed ? ' (unconfirmed)' : ''), all: 'all teaching cancelled', subjects: 'cancelled: ' + (e.subjects || []).join(', '), types: 'cancelled types: ' + (e.types || []).join(', ') }[e.effect]; }

/* ---------- Today ---------- */
function sessCard(s, compact) {
  const bt = ['present', 'absent', 'partial', 'cancelled', 'none'];
  const lab = { present: 'Present', absent: 'Absent', partial: 'Partial', cancelled: 'Cancelled', none: 'Not recorded' };
  return `<div class="card sess ${s.status === 'cancelled' ? 'cancelled' : ''}">
   <div class="row sp"><div><b>${ft(s.start)}–${ft(s.end)}</b> · ${fh(s.dur)}${s.extra ? ' · extra' : ''}<div class="big">${esc(s.subject)}</div><div class="sub">${esc(s.type)}${S.settings.excludedTypes.includes(s.type) ? ' · not counted (excluded type)' : ''}</div></div>
   <div style="text-align:right">${badge(s.status, STL[s.status])}${s.status === 'partial' ? `<div class="sub">${s.attMin || 0} min attended</div>` : ''}</div></div>
   ${s.eventName ? `<div class="sub">⚑ ${esc(s.eventName)}${s.auto ? ' — cancelled automatically. Tap Present/Absent if class was actually held.' : s.heldDespite ? ' — marked as held' : ''}</div>` : ''}
   <div class="btns">${bt.map(b => `<button class="b-${b} ${s.status === b ? 'on' : ''}" data-a="set" data-id="${esc(s.id)}" data-d="${s.date}" data-st="${b}" aria-pressed="${s.status === b}">${lab[b]}</button>`).join('')}</div>
   <div class="row"><button class="sm" data-a="set" data-id="${esc(s.id)}" data-d="${s.date}" data-st="excused" aria-pressed="${s.status === 'excused'}">Approved absence</button><button class="sm" data-a="editsess" data-id="${esc(s.id)}" data-d="${s.date}">Edit session</button>
   <input aria-label="Note" placeholder="Note (optional)" value="${esc(s.note)}" data-a="note" data-id="${esc(s.id)}" data-d="${s.date}" style="flex:1;min-width:160px"></div></div>`;
}
function today() {
  const d = ui.date, ss = sessionsOn(d), unrec = ss.filter(s => s.status === 'none');
  const markable = unrec.filter(s => s.date < now.date || (s.date === now.date && E.toMin(s.end) <= now.min));
  return `<div class="top"><h1>${d === now.date ? 'Today' : 'Attendance'} · ${fd(d, true)}</h1></div>
  <div class="row" style="margin:8px 0"><button data-a="day" data-n="-1" aria-label="Previous day">‹ Prev</button><input type="date" value="${d}" data-a="datepick" aria-label="Pick date" style="width:auto"><button data-a="day" data-n="1" aria-label="Next day">Next ›</button>${d !== now.date ? '<button data-a="gotoday">Today</button>' : ''}</div>
  <div class="row" style="margin-bottom:10px"><button class="pri" data-a="markall" ${markable.length ? '' : 'disabled'}>Mark ${markable.length} finished session${markable.length === 1 ? '' : 's'} Present</button><button data-a="addextra">+ Extra class</button></div>
  <p class="sub">${ss.filter(s => s.status !== 'none').length} of ${ss.length} recorded. Nothing is counted until you tap a status.</p>
  ${d < S.settings.startDate ? '<div class="banner info">Tracking starts on ' + fd(S.settings.startDate, true) + '. Nothing is recorded before that date.</div>' : ''}
  ${!ss.length && d >= S.settings.startDate ? '<div class="card mut">No classes scheduled on this date (Sunday, or no template entries).</div>' : ''}
  <div class="sess">${ss.map(s => sessCard(s)).join('')}</div>`;
}

/* ---------- Subjects ---------- */
function subjects() {
  const tr = tracks();
  if (ui.subj && tr[ui.subj]) return detail(tr[ui.subj], tr);
  const list = Object.values(tr).sort((a, b) => SEV[a.status] - SEV[b.status] || a.key.localeCompare(b.key));
  return `<div class="top"><h1>Subjects</h1></div><p class="sub">Each subject + session type is calculated separately, in hours. The black tick marks the ${S.settings.target}% target. Projections are estimates assuming every future session is held and attended.</p>${banners(tr)}<div class="grid">${list.map(trackCard).join('')}</div>`;
}
function detail(t, tr) {
  const f = ui.f, hist = t.all.filter(s => s.date <= now.date || s.status !== 'none').filter(s => (!f.status || s.status === f.status) && (!f.from || s.date >= f.from) && (!f.to || s.date <= f.to)).reverse();
  const abs = t.all.filter(s => ['absent', 'partial', 'excused'].includes(s.status)).reverse();
  const sib = Object.values(tr).filter(x => x.subject === t.subject && x.key !== t.key);
  return `<button class="sm" data-a="back">‹ All subjects</button>
  <div class="row sp" style="margin-top:8px"><div><h1>${esc(t.subject)}</h1><div class="sub">${esc(t.types.join(', '))}</div></div>${badge(t.status, TSL[t.status])}</div>
  <div class="card" style="margin-top:10px"><div class="pct">${t.pct == null ? 'No attendance data yet' : fp(t.pct)}${t.mode === 'scheduled' && t.pct != null ? ' <span class="sub">of term total (' + fh(t.Total) + ')</span>' : ''}</div><div class="bar ${t.status}"><i style="width:${Math.min(100, t.pct || 0)}%"></i><u style="left:${t.target}%"></u></div>
  <div class="kv"><span>Attended hours</span><span>${fh(t.A)}</span><span>Conducted hours (recorded)</span><span>${fh(t.conducted)}</span><span>Excluded hours (approved absences)</span><span>${fh(t.excluded)}</span><span>Countable conducted hours</span><span>${fh(t.C)}</span>${t.mode === 'scheduled' ? `<span>Attendance so far (of conducted)</span><span>${fp(t.curPct)}</span><span>Remaining + unrecorded hours</span><span>${fh(t.R)}</span><span>Term total (denominator)</span><span>${fh(t.Total)}</span><span>Hours needed in total for ${t.target}%</span><span>${fh(t.need)}</span>` : ''}<span>Missed hours</span><span>${fh(t.missed)}</span><span>Cancelled hours (not counted)</span><span>${fh(t.cancelled)}</span><span>Scheduled hours (non-cancelled, whole term)</span><span>${fh(t.sched)}</span><span>Target</span><span>${t.target}%</span>
  <span>Additional hours required (attend all)</span><span>${t.C <= 0 ? '—' : fh(t.required)}</span><span>Future countable hours (provisional)</span><span>${fh(t.F)}</span><span>Max future hours you can miss</span><span>${t.C <= 0 ? '—' : fh(t.M)}</span><span>…as whole sessions</span><span>${t.C <= 0 ? '—' : 'up to ' + t.skip.shortest + ' (shortest first) · ' + t.skip.inOrder + ' (next in order)'}</span>
  <span>Target reached by</span><span>${projText(t)}</span>${t.proj.status === 'ok' ? `<span>Sessions needed to get there</span><span>${t.proj.count}</span>` : ''}</div>
  <p class="sub">Forecast assumes all remaining scheduled sessions are conducted and attended. Term total and future hours are provisional: the weekly template is projected to ${fd(S.settings.termEnd, true)}, minus holidays and cancellations you've entered.${t.hasOpening ? ' Includes imported opening totals.' : ''}</p>
  ${t.proj.status === 'unreachable' ? '<div class="banner" role="alert">Target cannot be reached with the sessions currently configured, even with perfect attendance.</div>' : ''}</div>
  ${sib.length ? `<h2>Other session types for ${esc(t.subject)}</h2><div class="grid">${sib.map(trackCard).join('')}</div>` : ''}
  <h2>What-if calculator</h2><div class="card" id="wi">${wiForm(t)}<div id="wi-out" style="margin-top:12px"></div></div>
  <h2>Attendance history</h2><div class="card"><div class="two"><div><label>Status</label><select data-a="fstatus"><option value="">All</option>${E.STATUSES.map(s => `<option value="${s}" ${f.status === s ? 'selected' : ''}>${STL[s]}</option>`).join('')}</select></div><div></div><div><label>From</label><input type="date" data-a="ffrom" value="${f.from}"></div><div><label>To</label><input type="date" data-a="fto" value="${f.to}"></div></div>
  <div class="scroll"><table><thead><tr><th>Date</th><th>Time</th><th>Status</th><th>Hrs</th><th></th></tr></thead><tbody>${hist.map(s => { const c = E.contrib(s, S.settings.approved); return `<tr><td>${fd(s.date)}</td><td>${ft(s.start)}</td><td>${badge(s.status, STL[s.status])}${s.note ? `<div class="sub">${esc(s.note)}</div>` : ''}</td><td>${c ? fh(c.att) + ' / ' + fh(s.dur) : fh(s.dur)}</td><td><button class="sm" data-a="editsess" data-id="${esc(s.id)}" data-d="${s.date}">Edit</button></td></tr>`; }).join('') || '<tr><td colspan="5" class="mut">No matching records.</td></tr>'}</tbody></table></div></div>
  <h2>Absences</h2><div class="card">${abs.map(s => `<div class="row sp" style="padding:3px 0"><span>${fd(s.date, true)} · ${ft(s.start)}</span>${badge(s.status, STL[s.status])}</div>`).join('') || '<span class="mut">None recorded.</span>'}</div>
  <h2>Upcoming sessions</h2><div class="card">${t.future.slice(0, 12).map(s => `<div class="row sp" style="padding:3px 0"><span>${fd(s.date)} · ${ft(s.start)}–${ft(s.end)}</span><span class="sub">${fh(s.dur)}</span></div>`).join('') || '<span class="mut">No upcoming sessions.</span>'}${t.future.length > 12 ? `<p class="sub">+ ${t.future.length - 12} more (provisional).</p>` : ''}</div>`;
}
function wiForm(t) {
  const w = ui.wi;
  return `<p class="sub">Scenarios are temporary and never change your records.</p>
  <div class="chips" role="group" aria-label="Presets"><button data-a="wipreset" data-p="all">Attend everything</button><button data-a="wipreset" data-p="miss2">Miss next 2</button><button data-a="wipreset" data-p="miss1">Miss next session / posting</button><button data-a="wipreset" data-p="half">Half of next session</button><button data-a="wipreset" data-p="week">Cancel a week</button><button data-a="wipreset" data-p="extra">+4 extra hours</button><button data-a="wipreset" data-p="reset">Reset</button></div>
  <div class="two"><div><label>Next N sessions affected</label><input type="number" min="0" step="1" id="wi-n" value="${w.windowN}" data-wi="windowN"></div><div><label>Attend % of those sessions</label><input type="number" min="0" max="100" id="wi-p" value="${w.windowPct}" data-wi="windowPct"></div>
  <div><label>Weeks of classes cancelled</label><input type="number" min="0" step="1" id="wi-w" value="${w.cancelWeeks}" data-wi="cancelWeeks"></div><div><label>Extra teaching hours (attended)</label><input type="number" min="0" step="0.5" id="wi-x" value="${w.extraHours}" data-wi="extraHours"></div>
  <div><label>Target % (blank = ${t.target})</label><input type="number" min="0" max="100" id="wi-t" value="${w.target}" data-wi="target"></div></div>`;
}
function renderWI() {
  const el = $('#wi-out'); if (!el) return; const t = tracks()[ui.subj]; if (!t) return; const w = ui.wi;
  const T = w.target === '' ? null : +w.target;
  if (T != null && !(T >= 0 && T <= 100)) { el.innerHTML = '<div class="err">Target must be between 0 and 100.</div>'; return; }
  const r = E.whatIf(t, { windowN: +w.windowN, windowPct: +w.windowPct, cancelWeeks: +w.cancelWeeks, extraHours: +w.extraHours, target: T });
  const pj = r.proj.status === 'ok' ? fd(r.proj.session.date, true) : r.proj.status === 'reached' ? 'Target reached' : r.proj.status === 'unreachable' ? '⚠ Not reachable' : 'Cannot calculate';
  el.innerHTML = `<div class="scroll"><table><thead><tr><th></th><th>Now</th><th>After scenario window</th><th>End of term (rest attended)</th></tr></thead><tbody>
  <tr><td>Attendance</td><td>${fp(t.pct)}</td><td>${fp(r.afterWindow.pct)}</td><td>${fp(r.end.pct)}</td></tr>
  <tr><td>Attended h</td><td>${fh(t.A)}</td><td>${fh(r.afterWindow.A)}</td><td>${fh(r.end.A)}</td></tr>
  <tr><td>${r.mode === 'scheduled' ? 'Term total h' : 'Countable conducted h'}</td><td>${fh(t.D)}</td><td>${fh(r.afterWindow.C)}</td><td>${fh(r.end.C)}</td></tr>
  <tr><td>Meets ${r.target}%?</td><td>${t.mode === 'scheduled' ? (t.A >= (r.target / 100) * t.Total - 1e-7 ? 'Yes' : 'No') : (E.meets(t.A, t.C, r.target) ? 'Yes' : 'No')}</td><td>${r.meetsNow ? 'Yes' : 'No'}</td><td>${r.meetsEnd ? 'Yes' : 'No'}</td></tr></tbody></table></div>
  <div class="kv" style="margin-top:8px"><span>Absence allowance left after window</span><span>${fh(r.allowance)}</span><span>Projected date (estimate)</span><span>${pj}</span></div>`;
}

/* ---------- Timetable ---------- */
function timetable() {
  const tabs = [['week', 'Week'], ['agenda', 'Daily agenda'], ['upcoming', 'Upcoming'], ['template', 'Recurring template'], ['calendar', 'Calendar']];
  let body = '';
  if (ui.tab === 'week') {
    const days = [0, 1, 2, 3, 4, 5].map(i => E.addDays(ui.weekStart, i));
    body = `<div class="row" style="margin:8px 0"><button data-a="wk" data-n="-7">‹ Prev</button><b>${fd(days[0])} – ${fd(days[5], true)}</b><button data-a="wk" data-n="7">Next ›</button><button class="sm" data-a="wk" data-n="0">This week</button></div>
    <div class="week">${days.map(d => `<div class="day ${d === now.date ? 'today' : ''}"><b>${fd(d)}</b>${d === now.date ? ' <span class="badge s-ontrack">Today</span>' : ''}${sessionsOn(d).map(s => `<button class="slot" data-a="editsess" data-id="${esc(s.id)}" data-d="${d}"><b>${ft(s.start)} · ${fh(s.dur)}</b>${esc(s.subject)}<span class="sub"> ${esc(s.type)}</span><div>${badge(s.status, STL[s.status])}</div>${s.eventName ? `<div class="sub">⚑ ${esc(s.eventName)}</div>` : ''}</button>`).join('') || '<div class="sub">—</div>'}${E.eventsOn(d, S.events).map(e => `<div class="sub">⚑ ${esc(e.name)}</div>`).join('')}</div>`).join('')}</div><p class="sub">Lunch breaks are not sessions and never counted. Tap a session to edit or cancel it.</p>`;
  } else if (ui.tab === 'agenda') {
    const d = ui.agendaDate; body = `<div class="row" style="margin:8px 0"><button data-a="ag" data-n="-1">‹</button><input type="date" value="${d}" data-a="agpick" style="width:auto"><button data-a="ag" data-n="1">›</button></div><div class="sess">${sessionsOn(d).map(s => `<div class="card row sp"><span><b>${ft(s.start)}–${ft(s.end)}</b> ${esc(s.subject)} <span class="sub">${esc(s.type)}</span></span>${badge(s.status, STL[s.status])}</div>`).join('') || '<div class="card mut">No sessions.</div>'}</div>`;
  } else if (ui.tab === 'upcoming') {
    const up = E.generateSessions(S, now.date, E.addDays(now.date, 21)).filter(s => E.isFuture(s, now) || s.status === 'cancelled').slice(0, 40);
    body = `<div class="card" style="margin-top:8px">${up.map(s => `<div class="row sp" style="padding:4px 0"><span>${fd(s.date)} ${ft(s.start)} · ${esc(s.subject)} <span class="sub">${esc(s.type)}</span></span>${s.status === 'cancelled' ? badge('cancelled', 'Cancelled' + (s.eventName ? ' · ' + s.eventName : '')) : `<span class="sub">${fh(s.dur)}</span>`}</div>`).join('') || '<span class="mut">Nothing upcoming.</span>'}</div>`;
  } else if (ui.tab === 'template') {
    body = `<p class="sub">Edits here change future, unrecorded sessions only. Anything you've already recorded keeps its original subject and times.</p><button class="pri" data-a="addslot">+ Add recurring slot</button>
    ${[1, 2, 3, 4, 5, 6].map(dn => `<h2>${DN[dn]}</h2><div class="card">${S.template.filter(x => x.day === dn).sort((a, b) => E.toMin(a.start) - E.toMin(b.start)).map(x => `<div class="row sp" style="padding:4px 0"><span>${ft(x.start)}–${ft(x.end)} · <b>${x.clinical ? 'Clinical posting (' + esc(E.rotationDept(now.date < S.settings.startDate ? S.settings.startDate : now.date, S.rotation) || 'dept by rotation') + ' now)' : esc(x.subject)}</b> <span class="sub">${esc(x.type)}</span></span><span><button class="sm" data-a="editslot" data-id="${x.id}">Edit</button> <button class="sm dng" data-a="delslot" data-id="${x.id}">Delete</button></span></div>`).join('')}</div>`).join('')}`;
  } else {
    body = `<p class="sub">Add holidays, closures and exam periods. Cancelled classes are excluded from attendance, never counted as absences. Recorded sessions are never deleted.</p><button class="pri" data-a="addev">+ Add holiday / event</button>
    <div class="card" style="margin-top:10px">${S.events.slice().sort((a, b) => a.from < b.from ? -1 : 1).map(e => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row sp"><b>${esc(e.name)}</b><span><button class="sm" data-a="editev" data-id="${e.id}">Edit</button> <button class="sm dng" data-a="delev" data-id="${e.id}">Delete</button></span></div><div class="sub">${fd(e.from, true)}${e.to !== e.from ? ' – ' + fd(e.to, true) : ''} · ${effLabel(e)}</div>${e.note ? `<div class="sub">${esc(e.note)}</div>` : ''}${e.statedWeekday && DN[E.dow(e.from)] !== e.statedWeekday ? `<div class="banner">Stated as ${esc(e.statedWeekday)}, but ${fd(e.from, true)} is a ${DN[E.dow(e.from)]}. Verify.</div>` : ''}</div>`).join('')}</div>`;
  }
  return `<div class="top"><h1>Timetable</h1></div><div class="chips" role="tablist">${tabs.map(([k, n]) => `<button role="tab" aria-pressed="${ui.tab === k}" data-a="tab" data-v="${k}">${n}</button>`).join('')}</div>${body}`;
}

/* ---------- Settings & backup ---------- */
function settings() {
  const st = S.settings, tr = tracks();
  return `<div class="top"><h1>Settings &amp; backup</h1></div>
  ${accountCard()}<h2>Backup</h2><div class="card"><p class="sub">${A ? 'Your data is synced to your private account so it follows you across devices. Still export a backup now and then.' : 'Your data lives only in this browser until you sign in and upload it.'} ${A ? '' : 'Clearing site data deletes it — export a backup regularly.'} Last export: ${S.meta.lastExport ? esc(S.meta.lastExport.slice(0, 10)) : 'never'}.</p>
  <div class="row"><button class="pri" data-a="exp-json">Export backup (JSON)</button><button data-a="exp-rec">Records (CSV)</button><button data-a="exp-sum">Subject summary (CSV)</button></div>

  <h2>Attendance rules</h2><div class="card">
   <label>Target attendance (%)</label><input type="number" min="0" max="100" step="0.5" id="s-target" value="${st.target}">
   <label>Grouping for eligibility</label><select id="s-group"><option value="subjectType" ${st.grouping === 'subjectType' ? 'selected' : ''}>Separately by subject + session type (default)</option><option value="subject" ${st.grouping === 'subject' ? 'selected' : ''}>Combine session types within each subject</option></select>
   <label>Percentage is calculated against</label><select id="s-den"><option value="scheduled" ${st.denominator !== 'conducted' ? 'selected' : ''}>Total hours of the term (attended ÷ all scheduled hours) — default</option><option value="conducted" ${st.denominator === 'conducted' ? 'selected' : ''}>Hours conducted so far (reads 100% after one attended class)</option></select>
   <label>Approved / authorised absences count as</label><select id="s-appr"><option value="excluded" ${st.approved === 'excluded' ? 'selected' : ''}>Excluded (removed from denominator)</option><option value="attended" ${st.approved === 'attended' ? 'selected' : ''}>Attended</option><option value="absent" ${st.approved === 'absent' ? 'selected' : ''}>Absent</option></select>
   <label>Excluded session types (not counted in attendance)</label>${S.types.map(t => `<label class="chk"><input type="checkbox" class="s-ex" value="${esc(t)}" ${st.excludedTypes.includes(t) ? 'checked' : ''}>${esc(t)}</label>`).join('')}
   <p class="sub">Term total = hours conducted so far + remaining scheduled hours (from the weekly template, minus holidays you've entered) + past sessions you haven't recorded yet. Session-count rules aren't supported. Sports is excluded by default; untick it to track Sports.</p>
   <label class="chk"><input type="checkbox" id="s-pc" ${st.policyConfirmed ? 'checked' : ''}>I have confirmed these rules with the college</label>
