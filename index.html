<script>
/* Attendance engine — pure functions, no DOM. Works in browser (window.AttEngine) and Node. */
(function (root) {
'use strict';
const E = {};
const EPS = 1e-9;
const pad = n => String(n).padStart(2, '0');
E.SCHEMA = 2;

/* ---------- dates & time (all calendar dates are plain 'YYYY-MM-DD' strings; no local-timezone Date use) ---------- */
E.isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && E.fmt(E.parseDate(s)) === s;
E.isTime = s => typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
E.parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
E.fmt = d => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
E.addDays = (s, n) => { const d = E.parseDate(s); d.setUTCDate(d.getUTCDate() + n); return E.fmt(d); };
E.dow = s => E.parseDate(s).getUTCDay();                 // 0 = Sunday
E.mondayOf = s => { const w = E.dow(s); return E.addDays(s, w === 0 ? -6 : 1 - w); };
E.toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
E.hours = (a, b) => (E.toMin(b) - E.toMin(a)) / 60;
E.nowIST = (d = new Date()) => {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(d);
  const g = t => p.find(x => x.type === t).value;
  return { date: `${g('year')}-${g('month')}-${g('day')}`, min: (+g('hour')) * 60 + (+g('minute')) };
};

/* ---------- core arithmetic ---------- */
const clean = x => (Math.abs(x) < EPS ? 0 : x);
E.pct = (A, C) => (C > EPS ? (A / C) * 100 : null);
E.meets = (A, C, T) => C > EPS && (A / C) * 100 >= T - 1e-7;
// Additional hours that must be attended (all future hours attended) to reach T.
E.required = (A, C, T) => {
  if (C <= EPS || E.meets(A, C, T)) return 0;
  const t = T / 100;
  if (t >= 1) return Infinity;
  return clean(Math.max(0, (t * C - A) / (1 - t)));
};
// Governing inequality: A + (F - M) >= t (C + F)  =>  M <= A + F - t (C + F); clamp to [0, F].
E.maxAbsence = (A, C, F, T) => {
  const t = T / 100;
  return clean(Math.max(0, Math.min(F, A + F - t * (C + F))));
};
// Walk future sessions in order assuming attendance (optionally fractional); first session that reaches T.
E.project = (A, C, T, list) => {
  if (C > EPS && E.meets(A, C, T)) return { status: 'reached' };
  if (!list.length) return { status: 'none' };
  let a = A, c = C, n = 0;
  for (const s of list) {
    n++; a += s.dur * (s.frac == null ? 1 : s.frac); c += s.dur;
    if (E.meets(a, c, T)) return { status: 'ok', session: s, count: n, pct: (a / c) * 100 };
  }
  return { status: 'unreachable', finalPct: c > EPS ? (a / c) * 100 : null };
};
// How many whole future sessions could be skipped within M hours (shortest-first, and next-in-order).
E.skippable = (M, list) => {
  const d = list.map(s => s.dur).sort((a, b) => a - b); let tot = 0, shortest = 0;
  for (const x of d) { if (tot + x <= M + EPS) { tot += x; shortest++; } else break; }
  tot = 0; let inOrder = 0;
  for (const s of list) { if (tot + s.dur <= M + EPS) { tot += s.dur; inOrder++; } else break; }
  return { shortest, inOrder };
};
E.classify = ({ C, A, F, M, T }) => {
  if (C <= EPS) return 'nodata';
  if (E.meets(A, C, T)) return 'ontrack';
  if (F <= EPS) return 'unavailable';
  return M < 2 - EPS ? 'atrisk' : 'below';
};

/* ---------- default data ---------- */
E.STATUSES = ['none', 'present', 'absent', 'partial', 'excused', 'cancelled'];
const SLOT = (day, start, end, subject, type, clinical) => ({ id: day + '-' + start.replace(':', ''), day, start, end, subject, type, clinical: !!clinical });
E.defaultTemplate = () => {
  const L = 'Theory lecture', CP = 'Clinical posting', SP = 'Sports';
  const d = (day, a, b, c, d2, e) => [
    SLOT(day, '08:15', '09:15', a, L), SLOT(day, '09:15', '12:15', 'Clinical Posting', CP, true),
    ...b, SLOT(day, '16:00', '17:00', 'Sports', SP)];
  const mk = (day, s) => SLOT(day, s[0], s[1], s[2], L);

function renderWI() {

  <tr><td>Meets ${r.target}%?</td><td>${t.mode === 'scheduled' ? (t.A >= (r.target / 100) * t.Total - 1e-7 ? 'Yes' : 'No') : (E.meets(t.A, t.C, r.target) ? 'Yes' : 'No')}</td><td>${r.meetsNow ? 'Yes' : 'No'}</td><td>${r.meetsEnd ? 'Yes' : 'No'}</td></tr></tbody></table></div>

/* ---------- Timetable ---------- */
function timetable() {
  const tabs = [['week', 'Week'], ['agenda', 'Daily agenda'], ['upcoming', 'Upcoming'], ['template', 'Recurring template'], ['calendar', 'Calendar']];
  let body = '';
  if (ui.tab === 'week') {
    const days = [0, 1, 2, 3, 4, 5].map(i => E.addDays(ui.weekStart, i));
    body = `<div class="row" style="margin:8px 0"><button data-a="wk" data-n="-7">‹ Prev</button><b>${fd(days[0])} – ${fd(days[5], true)}</b><button data-a="wk" data-n="7">Next ›</button><button class="sm" data-a="wk" data-n="0">This week</button></div>
    <div class="week">${days.map(d => `<div class="day ${d === now.date ? 'today' : ''}"><b>${fd(d)}</b>${d === now.date ? ' <span class="badge s-ontrack">Today</span>' : ''}${sessionsOn(d).map(s => `<button class="slot" data-a="editsess" data-id="${esc(s.id)}" data-d="${d}"><b>${ft(s.start)} · ${fh(s.dur)}</b>${esc(s.subject)}<span class="sub"> ${esc(s.type)}</span><div>${badge(s.status, STL[s.status])}</div>${s.eventName ? `<div class="sub">⚑ ${esc(s.eventName)}</div>` : ''}</button>`).join('') || '<div class="sub">—</div>'}${E.eventsOn(d, S.events).map(e => `<div class="sub">⚑ ${esc(e.name)}</div>`).join('')}</div>`).join('')}</div><p class="sub">Lunch breaks are not sessions and never counted. Tap a session to edit or cancel it.</p>`;
  } else if (ui.tab === 'agenda') {
    const d = ui.agendaDate; body = `<div class="row" style="margin:8px 0"><button data-a="ag" data-n="-1">‹</button><input type="date" value="${d}" data-a="agpick" style="width:auto"><button data-a="ag" data-n="1">›</button></div><div class="sess">${sessionsOn(d).map(s => `<div class="card row sp"><span><b>${ft(s.start)}–${ft(s.end)}</b> ${esc(s.subject)} <span class="sub">${esc(s.type)}</span></span>${badge(s.status, STL[s.status])}</div>`).join('') || '<div class="card mut">No sessions.</div>'}</div>`;
  } else if (ui.tab === 'upcoming') {
    const up = E.generateSessions(S, now.date, E.addDays(now.date, 21)).filter(s => E.isFuture(s, now) || s.status === 'cancelled').slice(0, 40);
    body = `<div class="card" style="margin-top:8px">${up.map(s => `<div class="row sp" style="padding:4px 0"><span>${fd(s.date)} ${ft(s.start)} · ${esc(s.subject)} <span class="sub">${esc(s.type)}</span></span>${s.status === 'cancelled' ? badge('cancelled', 'Cancelled' + (s.eventName ? ' · ' + s.eventName : '')) : `<span class="sub">${fh(s.dur)}</span>`}</div>`).join('') || '<span class="mut">Nothing upcoming.</span>'}</div>`;
  } else if (ui.tab === 'template') {
    body = `<p class="sub">Edits here change future, unrecorded sessions only. Anything you've already recorded keeps its original subject and times.</p><button class="pri" data-a="addslot">+ Add recurring slot</button>
    ${[1, 2, 3, 4, 5, 6].map(dn => `<h2>${DN[dn]}</h2><div class="card">${S.template.filter(x => x.day === dn).sort((a, b) => E.toMin(a.start) - E.toMin(b.start)).map(x => `<div class="row sp" style="padding:4px 0"><span>${ft(x.start)}–${ft(x.end)} · <b>${x.clinical ? 'Clinical posting (' + esc(E.rotationDept(now.date < S.settings.startDate ? S.settings.startDate : now.date, S.rotation) || 'dept by rotation') + ' now)' : esc(x.subject)}</b> <span class="sub">${esc(x.type)}</span>${(x.skipNth || []).length ? ' <span class="badge s-below">Not held: ' + skipLabel(x.skipNth) + '</span>' : ''}</span><span><button class="sm" data-a="editslot" data-id="${x.id}">Edit</button> <button class="sm dng" data-a="delslot" data-id="${x.id}">Delete</button></span></div>`).join('')}</div>`).join('')}`;
  } else {
    body = `<p class="sub">Add holidays, closures and exam periods. Cancelled classes are excluded from attendance, never counted as absences. Recorded sessions are never deleted.</p><button class="pri" data-a="addev">+ Add holiday / event</button>
    <div class="card" style="margin-top:10px">${S.events.slice().sort((a, b) => a.from < b.from ? -1 : 1).map(e => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row sp"><b>${esc(e.name)}</b><span><button class="sm" data-a="editev" data-id="${e.id}">Edit</button> <button class="sm dng" data-a="delev" data-id="${e.id}">Delete</button></span></div><div class="sub">${fd(e.from, true)}${e.to !== e.from ? ' – ' + fd(e.to, true) : ''} · ${effLabel(e)}</div>${e.note ? `<div class="sub">${esc(e.note)}</div>` : ''}${e.statedWeekday && DN[E.dow(e.from)] !== e.statedWeekday ? `<div class="banner">Stated as ${esc(e.statedWeekday)}, but ${fd(e.from, true)} is a ${DN[E.dow(e.from)]}. Verify.</div>` : ''}</div>`).join('')}</div>`;
  }
  return `<div class="top"><h1>Timetable</h1></div><div class="chips" role="tablist">${tabs.map(([k, n]) => `<button role="tab" aria-pressed="${ui.tab === k}" data-a="tab" data-v="${k}">${n}</button>`).join('')}</div>${body}`;

  const ok = a && a.id && FOCUS_RE.test(a.id);

function afterRender(f) {

    Object.values(AU.getTrackColors(S.settings)).forEach(h => hexes.add(h));
    if (m && m.draft) m.draft.forEach(x => { if (x.color) hexes.add(x.color); });
    if (m && m.hex) hexes.add(m.hex);
    let st = document.getElementById('uc-css'); if (!st) { st = document.createElement('style'); st.id = 'uc-css'; document.head.appendChild(st); }
    const css = AU.css([...hexes].sort()); if (st.textContent !== css) st.textContent = css;
  } catch (_) {}
  CX = null;
  const open = ui.modal ? ui.modal.type : null, mine = !!(open && XMODALS[open]), box = $('.modal');
  const title = box && box.querySelector('h2[id]');
  if (mine && box) { if (title) box.setAttribute('aria-labelledby', title.id); if (open === f.modal && f.scroll != null) box.scrollTop = f.scroll; }
  const el = f.id && document.getElementById(f.id);
  if (mine && open !== f.modal) { if (title) title.focus({ preventScroll: true }); }
  else if (el) { el.focus({ preventScroll: true }); if (f.sel != null) try { el.setSelectionRange(f.sel, f.selEnd); } catch (_) {} }
  else if (mine && f.id) { if (title) title.focus({ preventScroll: true }); }
  else if (!open && f.modal && XMODALS[f.modal]) { const r = document.getElementById(ui.modalReturn || ''); if (r) r.focus({ preventScroll: true }); }
  lastModal = open;
}

/* --- "Can I skip this?" planner sub-view (read-only) --- */
const plDefaults = () => ({ sd: now.date, ed: now.date, st: '08:00', et: '16:00' });
function plannerView(tr) {
  const w = ui.pl || (ui.pl = plDefaults()), st = S.settings, cut = st.teachingEnds || '2027-06-13';
  const er = AU.validateWindow(S, w, E, d => fd(d, true));
  const out = er ? '' : plannerResults(AU.skipPlan(S, tr, now, w, E), tr);
  return `<button class="sm" id="pl-back" data-a="pl-back">‹ All subjects</button>
  <div class="top" style="margin-top:8px"><h1>Can I skip this?</h1></div>
  <p class="sub">A read-only estimate. It never changes your records. It assumes every other session is held and attended, and only counts future sessions you haven't recorded.</p>
  <div class="card"><div class="two">
   <div><label for="pl-sd">Start date</label><input type="date" id="pl-sd" data-pl="sd" value="${esc(w.sd)}" min="${st.startDate}" max="${cut}"></div>
   <div><label for="pl-st">Start time</label><input type="time" id="pl-st" data-pl="st" value="${esc(w.st)}"></div>

   <div><label for="pl-et">End time</label><input type="time" id="pl-et" data-pl="et" value="${esc(w.et)}"></div></div>
   <div class="row" style="margin-top:10px"><button id="pl-full" data-a="pl-full">Full day</button><button id="pl-reset" data-a="pl-reset">Today, 8 AM–4 PM</button></div>
   ${er ? `<div class="err" role="alert">${esc(er)}</div>` : ''}</div>${out}`;
}
function plannerResults(r, tr) {
  CX = makeCtx(tr);
  const ig = r.ignored, nIg = ig.cancelled + ig.recorded + ig.excluded + ig.past, totH = r.hits.reduce((a, x) => a + x.h, 0);
  const qual = [r.counts.tight && r.counts.tight + ' tight', r.counts.unreachable && r.counts.unreachable + ' already unreachable'].filter(Boolean).join(', ');
  const igTxt = nIg ? 'Ignored ' + nIg + ' session' + (nIg === 1 ? '' : 's') + ' in this window: ' + [ig.cancelled && ig.cancelled + ' cancelled or holiday', ig.recorded && ig.recorded + ' already recorded', ig.excluded && ig.excluded + ' excluded type (' + esc(S.settings.excludedTypes.join(', ')) + ')', ig.past && ig.past + ' already over'].filter(Boolean).join(', ') + '.' : 'No sessions in this window were ignored.';
  const mode = S.settings.denominator === 'conducted' ? 'Hours-conducted mode: final % = (attended + future − missed) ÷ (conducted + future).' : 'Term-total mode: best final hours = attended + (remaining − missed), compared with the hours needed.';
  const head = `<div class="card" style="margin-top:12px" role="status"><div class="big" id="pl-summary">${esc(r.summary)}${r.rows.length && !r.counts.falls && qual ? ' <span class="sub">(' + qual + ')</span>' : ''}</div>
   <p class="sub">${r.hits.length} session${r.hits.length === 1 ? '' : 's'} (${fh(totH)}) would be missed across ${r.rows.length} subject${r.rows.length === 1 ? '' : 's'}. ${igTxt}</p>
   <p class="sub"><b>Estimate only.</b> Assumes all other sessions are held and attended. ${mode} “Safe” means at least ${AU.BUFFER} h to spare.</p></div>`;
  if (!r.rows.length) return head;
  const buf = x => x.verdict === 'unreachable' ? 'short by ' + fh(-x.bufBefore) + ' even before skipping' : x.verdict === 'falls' ? 'short by ' + fh(-x.bufAfter) : x.verdict === 'nodata' ? 'schedule only' : fh(x.bufAfter) + ' to spare';
  const rows = r.rows.map(x => { const t = x.track; return `<tr><td data-label="Track"><span><b>${esc(t.subject)}</b><span class="sub"> ${esc(t.types.join(', '))}</span>${folderChip(t)}</span></td><td data-label="Sessions hit">${x.sessions}</td><td data-label="Hours missed">${fh(x.hours)}</td><td data-label="Allowance now">${fh(x.allowNow)}</td><td data-label="Allowance after skipping">${fh(x.allowAfter)}</td><td data-label="Projected final %">${fp(x.finalPct)}</td><td data-label="Target">${x.target}%${t.mode === 'scheduled' ? ` <span class="sub">(${fh(t.need)})</span>` : ''}</td><td data-label="Verdict"><span><span class="vd vd-${x.verdict}">${AU.VERDICT[x.verdict]}</span><div class="sub">${buf(x)}</div></span></td></tr>`; }).join('');
  const sess = r.hits.map(h => { const t = tr[h.key]; return `<tr class="${rowCls(t, h.type).trim()}"><td>${fd(h.date)}</td><td>${ft(h.start)}–${ft(h.end)}</td><td>${esc(h.subject)} ${chipFor(t, h.type)}</td><td>${fh(h.h)}${h.h < h.dur - 1e-9 ? ` <span class="sub">of ${fh(h.dur)}, partly in window</span>` : ''}</td></tr>`; }).join('');
  return head + `<div class="card" style="margin-top:12px"><div class="scroll"><table class="stack" id="pl-table"><thead><tr><th>Track</th><th>Sessions hit</th><th>Hours missed</th><th>Allowance now</th><th>Allowance after skipping</th><th>Projected final %</th><th>Target</th><th>Verdict</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <details class="card" style="margin-top:12px" id="pl-sess"><summary>Affected sessions (${r.hits.length})</summary><div class="scroll"><table><thead><tr><th>Date</th><th>Time</th><th>Subject</th><th>Hours counted</th></tr></thead><tbody>${sess}</tbody></table></div></details>`;
}

/* --- event wiring for the features above (separate listeners; existing handlers untouched) --- */
document.addEventListener('click', ev => { const el = ev.target.closest('[data-a="nav"]'); if (el) ui.planner = false; }, true);
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || !S) return; const a = el.dataset.a, d = el.dataset, m = ui.modal;
  switch (a) {
    case 'w-open': ui.modal = { type: 'warnings' }; ui.modalReturn = 'wfab'; return render();
    case 'w-restore': mutate(S => { S.settings.dismissedWarnings = AU.restore(AU.getDismissed(S.settings), d.id); }, 'Warning restored'); return;
    case 'w-restore-all': mutate(S => { S.settings.dismissedWarnings = []; }, 'All warnings restored'); return;
    case 'planner-open': ui.view = 'subjects'; ui.subj = null; ui.planner = true; if (!ui.pl) ui.pl = plDefaults(); $('#app').scrollTop = 0; return render();
    case 'pl-back': ui.planner = false; return render();
    case 'pl-full': ui.pl.st = '00:00'; ui.pl.et = '23:59'; return render();
    case 'pl-reset': ui.pl = plDefaults(); return render();
    case 'sf-chip': ui.sf.chip = d.v; return render();
    case 'subject-skip': ui.view='subjects';ui.subj=null;ui.planner=true;ui.pl=plDefaults();return render();
    case 'catalog-add': {
      const name=val('cat-new-name').trim(), group=val('cat-new-group')||'other', aliases=val('cat-new-alias').split(',').map(x=>x.trim()).filter(Boolean);
      if(!name){const e=$('#catalog-error');if(e)e.textContent='Enter a subject name.';return;}
      const draft=(Array.isArray(ui.catalogDraft)?ui.catalogDraft:subjectCatalog()).map(x=>Object.assign({},x,{aliases:[...(x.aliases||[])]}));
