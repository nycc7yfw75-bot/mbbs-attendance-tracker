<main id="app" aria-live="polite"></main>
<nav class="tabs" id="nav" aria-label="Main"></nav>

<div id="toast"></div>
<script>
/* Attendance engine — pure functions, no DOM. Works in browser (window.AttEngine) and Node. */
(function (root) {
'use strict';
const E = {};
const EPS = 1e-9;
const pad = n => String(n).padStart(2, '0');
E.SCHEMA = 2;

/* ---------- dates & time (all calendar dates are plain 'YYYY-MM-DD' strings; no local-timezone Date use) ---------- */
E.isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && E.fmt(E.parseDate(s)) === s;
E.isTime = s => typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
E.parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
E.fmt = d => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
E.addDays = (s, n) => { const d = E.parseDate(s); d.setUTCDate(d.getUTCDate() + n); return E.fmt(d); };
E.dow = s => E.parseDate(s).getUTCDay();                 // 0 = Sunday
E.mondayOf = s => { const w = E.dow(s); return E.addDays(s, w === 0 ? -6 : 1 - w); };
E.toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
E.hours = (a, b) => (E.toMin(b) - E.toMin(a)) / 60;
E.nowIST = (d = new Date()) => {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(d);
  const g = t => p.find(x => x.type === t).value;
  return { date: `${g('year')}-${g('month')}-${g('day')}`, min: (+g('hour')) * 60 + (+g('minute')) };
};

/* ---------- core arithmetic ---------- */
const clean = x => (Math.abs(x) < EPS ? 0 : x);
E.pct = (A, C) => (C > EPS ? (A / C) * 100 : null);
E.meets = (A, C, T) => C > EPS && (A / C) * 100 >= T - 1e-7;
// Additional hours that must be attended (all future hours attended) to reach T.
E.required = (A, C, T) => {
  if (C <= EPS || E.meets(A, C, T)) return 0;
  const t = T / 100;
  if (t >= 1) return Infinity;
  return clean(Math.max(0, (t * C - A) / (1 - t)));
};
// Governing inequality: A + (F - M) >= t (C + F)  =>  M <= A + F - t (C + F); clamp to [0, F].
E.maxAbsence = (A, C, F, T) => {
  const t = T / 100;
  return clean(Math.max(0, Math.min(F, A + F - t * (C + F))));
};
// Walk future sessions in order assuming attendance (optionally fractional); first session that reaches T.
E.project = (A, C, T, list) => {
  if (C > EPS && E.meets(A, C, T)) return { status: 'reached' };
  if (!list.length) return { status: 'none' };
  let a = A, c = C, n = 0;
  for (const s of list) {
    n++; a += s.dur * (s.frac == null ? 1 : s.frac); c += s.dur;
    if (E.meets(a, c, T)) return { status: 'ok', session: s, count: n, pct: (a / c) * 100 };
  }
  return { status: 'unreachable', finalPct: c > EPS ? (a / c) * 100 : null };
};
// How many whole future sessions could be skipped within M hours (shortest-first, and next-in-order).
E.skippable = (M, list) => {
  const d = list.map(s => s.dur).sort((a, b) => a - b); let tot = 0, shortest = 0;
  for (const x of d) { if (tot + x <= M + EPS) { tot += x; shortest++; } else break; }
  tot = 0; let inOrder = 0;
  for (const s of list) { if (tot + s.dur <= M + EPS) { tot += s.dur; inOrder++; } else break; }
  return { shortest, inOrder };
};
E.classify = ({ C, A, F, M, T }) => {
  if (C <= EPS) return 'nodata';
  if (E.meets(A, C, T)) return 'ontrack';
  if (F <= EPS) return 'unavailable';
  return M < 2 - EPS ? 'atrisk' : 'below';
};

/* ---------- default data ---------- */
E.STATUSES = ['none', 'present', 'absent', 'partial', 'excused', 'cancelled'];
const SLOT = (day, start, end, subject, type, clinical) => ({ id: day + '-' + start.replace(':', ''), day, start, end, subject, type, clinical: !!clinical });
E.defaultTemplate = () => {
  const L = 'Theory lecture', CP = 'Clinical posting', SP = 'Sports';
  const d = (day, a, b, c, d2, e) => [
    SLOT(day, '08:15', '09:15', a, L), SLOT(day, '09:15', '12:15', 'Clinical Posting', CP, true),
    ...b, SLOT(day, '16:00', '17:00', 'Sports', SP)];
  const mk = (day, s) => SLOT(day, s[0], s[1], s[2], L);
  const out = [];
  const days = {
    1: ['Medicine & Allied', [['13:00', '14:00', 'FMT'], ['14:00', '15:00', 'Community Medicine'], ['15:00', '16:00', 'Community Medicine']]],
    2: ['Medicine & Allied', [['13:00', '14:00', 'Paediatrics'], ['14:00', '15:00', 'ENT'], ['15:00', '16:00', 'ENT']]],
    3: ['Surgery & Allied', [['13:00', '14:00', 'FMT'], ['14:00', '15:00', 'Ophthalmology'], ['15:00', '16:00', 'Ophthalmology']]],
    4: ['Paediatrics', [['13:00', '14:00', 'Ophthalmology'], ['14:00', '15:00', 'Obstetrics & Gynaecology'], ['15:00', '16:00', 'FMT']]],
    5: ['ENT', [['13:00', '14:00', 'Community Medicine'], ['14:00', '15:00', 'Community Medicine'], ['15:00', '16:00', 'Community Medicine']]],
    6: ['Surgery & Allied', [['12:15', '13:15', 'Obstetrics & Gynaecology'], ['14:00', '15:00', 'FMT'], ['15:00', '16:00', 'Community Medicine']]],
  };
  for (const day of Object.keys(days)) {
    const [first, rest] = days[day]; const dn = +day;
    out.push(SLOT(dn, '08:15', '09:15', first, L), SLOT(dn, '09:15', '12:15', 'Clinical Posting', CP, true));
    rest.forEach(r => { const slot = mk(dn, r); if (dn === 6 && (slot.subject === 'FMT' || slot.subject === 'Obstetrics & Gynaecology')) slot.type = 'Practical'; out.push(slot); });
    out.push(SLOT(dn, '16:00', '17:00', 'Sports', SP));
  }
  out.forEach(x => { if (x.day === 6 && ((x.subject === 'FMT' && x.start === '14:00') || (x.subject === 'Community Medicine' && x.start === '15:00'))) x.skipNth = [2, 4]; });
  return out;
};
E.defaultEvents = () => [
  { id: 'ev-term-start', name: 'Academic term starts', kind: 'term', from: '2026-10-12', to: '2026-10-12', effect: 'normal', subjects: [], types: [], note: '', unconfirmed: false },
  { id: 'ev-winter', name: 'Winter vacation', kind: 'vacation', from: '2026-11-07', to: '2026-11-13', effect: 'all', subjects: [], types: [], note: '', unconfirmed: false },
  { id: 'ev-pct1', name: 'PCT-I examinations — ENT, Ophthalmology', kind: 'exam', from: '2026-12-15', to: '2026-12-16', effect: 'normal', subjects: [], types: [], note: 'Effect on regular classes not stated in the timetable — set it when known.', unconfirmed: true },
  { id: 'ev-t1a', name: 'I Term End Theory — Medicine, Surgery, OB/GY, Paediatrics', kind: 'exam', from: '2027-02-15', to: '2027-02-21', effect: 'normal', subjects: [], types: [], note: 'Effect on regular classes not stated — set it when known.', unconfirmed: true },
  { id: 'ev-t1b', name: 'I Term End Theory — Community Medicine, FMT, ENT, Ophthalmology', kind: 'exam', from: '2027-02-22', to: '2027-02-28', effect: 'normal', subjects: [], types: [], note: 'Effect on regular classes not stated — set it when known.', unconfirmed: true },
  { id: 'ev-fmtprac', name: 'FMT practical examinations', kind: 'exam', from: '2027-03-01', to: '2027-03-07', effect: 'normal', subjects: [], types: [], note: 'Effect on regular classes not stated — set it when known.', unconfirmed: true },

  const r = E.whatIf(t, { windowN: +w.windowN, windowPct: +w.windowPct, cancelWeeks: +w.cancelWeeks, extraHours: +w.extraHours, target: T });
  const pj = r.proj.status === 'ok' ? fd(r.proj.session.date, true) : r.proj.status === 'reached' ? 'Target reached' : r.proj.status === 'unreachable' ? '⚠ Not reachable' : 'Cannot calculate';
  el.innerHTML = `<div class="scroll"><table><thead><tr><th></th><th>Now</th><th>After scenario window</th><th>End of term (rest attended)</th></tr></thead><tbody>
  <tr><td>Attendance</td><td>${fp(t.pct)}</td><td>${fp(r.afterWindow.pct)}</td><td>${fp(r.end.pct)}</td></tr>
  <tr><td>Attended h</td><td>${fh(t.A)}</td><td>${fh(r.afterWindow.A)}</td><td>${fh(r.end.A)}</td></tr>
  <tr><td>${r.mode === 'scheduled' ? 'Term total h' : 'Countable conducted h'}</td><td>${fh(t.D)}</td><td>${fh(r.afterWindow.C)}</td><td>${fh(r.end.C)}</td></tr>
  <tr><td>Meets ${r.target}%?</td><td>${t.mode === 'scheduled' ? (t.A >= (r.target / 100) * t.Total - 1e-7 ? 'Yes' : 'No') : (E.meets(t.A, t.C, r.target) ? 'Yes' : 'No')}</td><td>${r.meetsNow ? 'Yes' : 'No'}</td><td>${r.meetsEnd ? 'Yes' : 'No'}</td></tr></tbody></table></div>
  <div class="kv" style="margin-top:8px"><span>Absence allowance left after window</span><span>${fh(r.allowance)}</span><span>Projected date (estimate)</span><span>${pj}</span></div>`;
}

  } else {

const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };

function findSession(id, d) { return sessionsOn(d).find(s => s.id === id); }
function setStatus(id, d, st, attMin) {
  const s = findSession(id, d); if (!s) return;
  mutate(S => {
    let en = S.entries[id] || (S.entries[id] = {});
    if (st === 'none' && !en.edited) { delete S.entries[id]; return; }

async function saveFile(name, data) {

}

function plannerResults(r, tr) {

  return head + `<div class="card" style="margin-top:12px"><div class="scroll"><table class="stack" id="pl-table"><thead><tr><th>Track</th><th>Sessions hit</th><th>Hours missed</th><th>Allowance now</th><th>Allowance after skipping</th><th>Projected final %</th><th>Target</th><th>Verdict</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <details class="card" style="margin-top:12px" id="pl-sess"><summary>Affected sessions (${r.hits.length})</summary><div class="scroll"><table><thead><tr><th>Date</th><th>Time</th><th>Subject</th><th>Hours counted</th></tr></thead><tbody>${sess}</tbody></table></div></details>`;
}
